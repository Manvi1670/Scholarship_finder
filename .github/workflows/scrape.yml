name: Refresh Scholarship Data

on:
  schedule:
    # Twice weekly: Sunday and Wednesday, 2 AM UTC
    - cron: '0 2 * * 0,3'
  workflow_dispatch:   # lets you trigger it manually from the Actions tab, for testing

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chrome (needed for Selenium)
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies
        run: |
          cd ScholarSeek/Scraper
          pip install -r requirements.txt

      - name: Run the full refresh pipeline
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DB_NAME: scholarship_finder
        run: |
          cd ScholarSeek/Scraper
          python refresh_all.py